<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hubie's Limbo — LOCAL TEST GAME</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; font-family: system-ui, sans-serif; color: #e9f4f2; background: radial-gradient(circle at 50% 30%, #0b3d47, #021317 70%); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: rgba(0,0,0,.35); }
  header h1 { margin: 0; font-size: 22px; color: #f0b549; }
  .tag { font-size: 12px; letter-spacing: 1px; padding: 4px 8px; border: 1px solid #f19a3a; color: #f19a3a; border-radius: 6px; }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 24px; }
  .panel { background: rgba(0,0,0,.3); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; color: #8fb3b0; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2b6a76; background: #011417; color: #fff; font-size: 18px; }
  button.play { padding: 16px; font-size: 20px; font-weight: 700; border: 0; border-radius: 10px; background: linear-gradient(#7ee0a3, #2ea86a); color: #04230f; cursor: pointer; }
  button.play:disabled { opacity: .5; cursor: wait; }
  .board { position: relative; display: grid; place-items: center; border-radius: 14px; background: rgba(0,0,0,.2); }
  #result { font-size: 160px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #result.win { color: #7ee0a3; } #result.loss { color: #ff8a8a; }
  #status { position: absolute; bottom: 24px; font-size: 22px; color: #cfe3e0; }
  #bonus { position: absolute; top: 24px; padding: 10px 24px; border-radius: 10px; background: #f0b549; color: #2a1a00; font-weight: 800; font-size: 28px; display: none; }
  body[data-state="bonus"] #bonus { display: block; }
  .history { display: flex; gap: 6px; flex-wrap: wrap; }
  .history span { padding: 3px 8px; border-radius: 6px; font-size: 13px; background: #0b3d47; }
  .history span.w { background: #1f6b3e; }
  #gate { position: fixed; inset: 0; background: rgba(1,10,12,.9); display: grid; place-items: center; }
  #gate .box { background: #04282f; padding: 30px; border-radius: 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; width: 380px; }
  #gate button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #3cd8ff; background: #0b3d47; color: #fff; cursor: pointer; }
</style>
</head>
<body data-state="gate">
  <header>
    <h1>Hubie's Limbo</h1>
    <span class="tag">LOCAL TEST GAME · NOT A HOUSEBETS GAME · PLAY MONEY</span>
    <div>Balance: <b id="balance" data-testid="balance">1000.00</b> FUN</div>
  </header>
  <main>
    <section class="panel" aria-label="Bet controls">
      <div><label for="stake">Stake (play money)</label><input id="stake" type="number" value="1" min="0.1" step="0.1" /></div>
      <div><label for="target">Target multiplier</label><input id="target" type="number" value="2" min="1.01" step="0.01" /></div>
      <button class="play" id="play" aria-label="Play round">Play</button>
      <div><label>History</label><div class="history" id="history"></div></div>
    </section>
    <section class="board">
      <div id="bonus" role="alert">BONUS!</div>
      <div id="result" role="status" aria-live="polite" data-testid="result" data-round="0">1.00×</div>
      <div id="status">Set a target and press Play</div>
    </section>
  </main>
  <div id="gate">
    <div class="box">
      <h2>Welcome</h2>
      <button id="login">Log in</button>
      <button id="demo">Play demo (fun mode)</button>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let balance = 1000, round = 0, busy = false;
  $('demo').onclick = () => { $('gate').remove(); document.body.dataset.state = 'idle'; };
  $('login').onclick = () => alert('Login is not available in this local test game.');
  function crash() { const u = crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32 || 1e-9; return Math.max(1, Math.floor((0.99 / u) * 100) / 100); }
  $('play').onclick = async () => {
    if (busy) return;
    busy = true; $('play').disabled = true; document.body.dataset.state = 'rolling';
    const stake = Math.max(0.1, Number($('stake').value) || 1), target = Math.max(1.01, Number($('target').value) || 2);
    const r = crash();
    const res = $('result'); res.className = ''; $('status').textContent = 'Rolling…';
    const t0 = performance.now(), dur = 1100;
    await new Promise((done) => { (function step(now) { const f = Math.min(1, (now - t0) / dur); const v = 1 + (Math.min(r, target * 1.3) - 1) * (1 - Math.pow(1 - f, 3)); res.textContent = (f < 1 ? v : r).toFixed(2) + '×'; f < 1 ? requestAnimationFrame(step) : done(); })(t0); });
    const win = r >= target;
    balance += win ? stake * target - stake : -stake;
    round++;
    res.className = win ? 'win' : 'loss';
    res.dataset.round = String(round); res.dataset.outcome = win ? 'win' : 'loss'; res.dataset.rolled = String(r);
    res.dataset.target = String(target); res.dataset.payout = String(win ? stake * target : 0); res.dataset.stake = String(stake);
    $('balance').textContent = balance.toFixed(2);
    $('status').textContent = win ? `WIN · ${target}× target hit` : `Missed ${target}× target`;
    const h = document.createElement('span'); h.textContent = r.toFixed(2) + '×'; if (win) h.className = 'w'; $('history').prepend(h);
    while ($('history').children.length > 12) $('history').lastChild.remove();
    document.body.dataset.state = r >= 20 ? 'bonus' : 'result';
    busy = false; $('play').disabled = false;
  };
</script>
</body>
</html>
